# ====================================================================
# Tmux Config
# ====================================================================

# Use vi keys in copy mode so that navigation matches Neovim.
setw -g mode-keys vi

# Allows terminal to recognize and pass complex keyboard shortcuts
# into tmux and applications running inside tmux.
set-option -g extended-keys on
set -g extended-keys-format csi-u

# ====================================================================
# Pane Navigation
# ====================================================================

# Panes are switched with <ctrl>-h/j/k/l, the same keys Neovim uses to
# switch windows. When the active pane is running Neovim, the key is
# forwarded to Neovim instead so that it can move between its own
# windows first. Paired with the vim-tmux-navigator plugin in the
# Neovim configuration, Neovim windows and tmux panes behave like one
# continuous grid.

# Determine whether the process in the active pane is Vim or Neovim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Switch back to the previously active pane.
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Since <ctrl>-l now switches panes, keep a way to clear the screen.
bind-key C-l send-keys 'C-l'

# Use the same keys to switch panes from copy mode.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ====================================================================
# Active Pane
# ====================================================================

# Make it obvious which pane is active. The active pane gets a heavy
# border in the palette's yellow, which zenbones renders as a rust
# brown; every other border is the palette's bright black, a step off
# the background in either direction.
#
# These are palette slots rather than hex, like the status bar below,
# so the borders follow whatever theme the terminal is set to. That is
# what lets a theme switch recolor tmux without tmux being reloaded or
# even told: the slots do not change, only what the terminal maps them
# to.

setw -g pane-border-lines heavy
setw -g pane-border-style 'fg=colour8'
setw -g pane-active-border-style 'fg=colour3'

# ====================================================================
# Status Bar
# ====================================================================

# A quieter status bar than the default green block. The session name
# and the clock on the right are both dropped, leaving just the window
# list. The current window is bold; the rest are dimmed.
#
# Like the pane borders above, these are palette slots, so the bar
# follows the terminal. bg=colour0 below is a no-op under both
# zenbones variants, where colour0 and the background are the same
# color; it only shows up under a theme whose black differs from its
# background.

set -g status-left ''
set -g status-right ''
set -g status-style 'fg=colour2'

setw -g window-status-format ' #I #[fg=colour7]#W #[fg=colour2]#F '
setw -g window-status-style 'fg=colour2 dim'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-current-style 'fg=colour2 bg=colour0 bold'
setw -g window-status-bell-style 'fg=colour2 bg=colour0 bold'
