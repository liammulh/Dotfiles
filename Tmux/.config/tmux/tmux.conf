# ====================================================================
# Tmux Config
# ====================================================================

# Use vi keys in copy mode so that navigation matches Neovim.
setw -g mode-keys vi

# ====================================================================
# Pane Navigation
# ====================================================================

# Panes are switched with <ctrl>-h/j/k/l, the same keys Neovim uses to
# switch windows. When the active pane is running Neovim, the key is
# forwarded to Neovim instead so that it can move between its own
# windows first. Paired with the vim-tmux-navigator plugin in the
# Neovim configuration, Neovim windows and tmux panes behave like one
# continuous grid.

# Determine whether the process in the active pane is Vim or Neovim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Switch back to the previously active pane.
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Since <ctrl>-l now switches panes, keep a way to clear the screen.
bind-key C-l send-keys 'C-l'

# Use the same keys to switch panes from copy mode.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ====================================================================
# Active Pane
# ====================================================================

# Make it obvious which pane is active. The active pane gets a heavy
# border in gruvbox orange; every other border is a muted gray that
# recedes into the background. The colors match the gruvbox dark theme
# Alacritty is using.

setw -g pane-border-lines heavy
setw -g pane-border-style 'fg=#504945'
setw -g pane-active-border-style 'fg=#fe8019'

# ====================================================================
# Status Bar
# ====================================================================

# A quieter status bar than the default green block. The session name
# and the clock on the right are both dropped, leaving just the window
# list. The current window is bold; the rest are dimmed.
#
# These use palette slots rather than hex so the bar follows whatever
# theme the terminal is set to, instead of pinning it to gruvbox the
# way the pane borders above are. bg=colour0 below is a no-op under
# gruvbox dark, where colour0 and the background are both #282828; it
# only shows up under a theme whose black differs from its
# background.

set -g status-left ''
set -g status-right ''
set -g status-style 'fg=colour2'

setw -g window-status-format ' #I #[fg=colour7]#W #[fg=colour2]#F '
setw -g window-status-style 'fg=colour2 dim'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-current-style 'fg=colour2 bg=colour0 bold'
setw -g window-status-bell-style 'fg=colour2 bg=colour0 bold'
