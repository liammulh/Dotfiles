[general]
# The palette is not set here. It is a generated file, which is what
# makes light and dark switchable at runtime: Alacritty watches the
# files it imports and reloads when one of them changes. The Theme
# section of the repository README has the two commands that write it;
# it has to be created once on a new machine.
import = [
    "~/.local/state/theme/alacritty.toml"
]

[font]
size = 12.0
[font.normal]
family = "DepartureMono Nerd Font Mono"
style = "Regular"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Send <ctrl>-<shift>-h/j/k/l as CSI u sequences so that tmux can tell
# them apart from <ctrl>-h/j/k/l and use them to resize panes. 104,
# 106, 107 and 108 are the codepoints of h, j, k and l; the 6 means
# ctrl plus shift.
[[keyboard.bindings]]
key = "H"
mods = "Control|Shift"
chars = "\u001B[104;6u"

[[keyboard.bindings]]
key = "J"
mods = "Control|Shift"
chars = "\u001B[106;6u"

[[keyboard.bindings]]
key = "K"
mods = "Control|Shift"
chars = "\u001B[107;6u"

[[keyboard.bindings]]
key = "L"
mods = "Control|Shift"
chars = "\u001B[108;6u"

# Blink the cursor so the active tmux pane is easy to spot. "Always"
# forces blinking on regardless of what the running program asks for,
# which matters inside tmux. A blink_timeout of 0 means the cursor
# keeps blinking instead of going solid after a few seconds.
[cursor]
blink_interval = 600
blink_timeout = 0
[cursor.style]
shape = "Block"
blinking = "Always"
